services:
  postgres:
    image: postgres:17-alpine
    container_name: tradepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradepilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tradepilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradepilot-postgres-data:
